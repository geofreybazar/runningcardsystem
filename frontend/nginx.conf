# Serves the app and proxies /api to the backend, so the refresh cookie stays same-origin.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Server-Sent Events: pass each event through immediately and keep the long-lived connection open.
  location /api/notifications/stream {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 15m; # the server ends each stream after 10 min and pings every 25 s
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
