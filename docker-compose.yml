# Full stack: Postgres, API, and the built frontend on http://localhost:8080
# Needs backend/.env (see backend/.env.example) and VITE_GOOGLE_API set in your shell or in a .env next to this file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: runningcard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/runningcard
      FRONTEND_ORIGIN: http://localhost:8080

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_API: ${VITE_GOOGLE_API}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
