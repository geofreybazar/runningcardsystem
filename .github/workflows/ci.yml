name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be halfway through a deploy. Newer main pushes queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# shortcut: both jobs always run (the frontend also imports backend/src/shared), add path filters if CI minutes matter.
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # same as the Dockerfiles
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16 # same as docker-compose.yml
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runningcard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for a database that exists only for this run; the e2e setup wipes it (name must end in _test).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runningcard_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runningcard_test
      JWT_SECRET: ci-only-dummy-secret-not-used-anywhere-else-0123456789
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate # Prisma 7 doesn't generate on install; src/generated/ is gitignored
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  # Clicks through the real UI (frontend/e2e, Playwright) against the API on a fresh test database.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runningcard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for a database that exists only for this run (wiped by the test server; name must end in _test).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runningcard_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runningcard_test
      JWT_SECRET: ci-only-dummy-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # CD: once every check passes on a push to main, the VPS pulls this commit and rebuilds (docs/development/deployment.md#continuous-deployment).
  # Skipped until the repo variable VPS_HOST is set, so CI stays green before the VPS exists.
  deploy:
    needs: [frontend, backend, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }} # pinned host key: no trust-on-first-use from a fresh runner
          TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
          APP_DIR: ${{ vars.VPS_PATH }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Deploys exactly the commit that was tested; --wait fails the job if a service doesn't come up.
          ssh "$TARGET" "set -e; cd '$APP_DIR'; git fetch -q origin main; git checkout -q main; git merge -q --ff-only $SHA;
            GIT_COMMIT=\$(git rev-parse --short HEAD) docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300;
            docker image prune -f"
